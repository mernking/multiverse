[licenses]
# Allow licenses that are compatible with MIT/Apache-2.0
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
]
# Deny copyleft licenses that would force our code to be open source
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
    "LGPL-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
]
# Allow these specific crates even if their license is not in the allow list
allow-ambiguous = false
confidence-threshold = 0.8

[advisories]
# Check for security vulnerabilities
db-path = "~/.cargo/advisory-db"
db-url = "https://github.com/RustSec/advisory-db.git"
# Ignore specific advisories if needed (e.g., false positives)
ignore = []

[bans]
# Deny specific crates or versions
deny = [
    { name = "openssl", version = "*", reason = "Use rustls instead" },
]
# Warn about multiple versions of the same crate
multiple-versions = "warn"
# Allow these crates to have multiple versions
allow-multiple-versions = [
    "serde",
    "serde_json",
    "thiserror",
    "anyhow",
    "uuid",
    "parking_lot",
    "tokio",
    "glam",
    "bytemuck",
]

[format]
# Output format for deny check
format = "json"